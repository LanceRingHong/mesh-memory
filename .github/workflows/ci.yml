name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        shell: bash
        run: npm run check
      - name: unit tests
        shell: bash
        run: |
          set -o pipefail
          if node --test > test-output.txt 2>&1; then
            cat test-output.txt
            exit 0
          fi
          node scripts/ci-annotate.mjs test-output.txt
          cat test-output.txt
          exit 1
